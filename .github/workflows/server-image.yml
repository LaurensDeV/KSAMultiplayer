# The dedicated server as a container image, for the machine infra/server deploys it to.
#
# The digest is what gets deployed, not the tag: infra/server pins TF_VAR_server_image to it, so a
# machine runs the image that was built rather than whatever the tag points at today.

name: Server image

on:
  push:
    branches: [main]
    paths:
      - "src/Protocol/**"
      - "src/Server/**"
      - "deploy/Dockerfile"
      - "global.json"
      - "Directory.Build.props"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ksamp-server
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # What to put in infra/server/.env, so deploying is a copy rather than a hunt through the registry.
      - name: The digest to deploy
        run: |
          echo "### Deploy this" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "export TF_VAR_server_image=ghcr.io/${{ github.repository_owner }}/ksamp-server@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
