# A release is the mod and the server together. A game and a server of different Wire.Versions refuse
# each other by name, so the zip a player installs and the image a host runs go out under one tag,
# and the notes say which version they speak.
#
#   git tag -a v0.1.0 -m "..." && git push origin v0.1.0
#
# The version in the tag must be the <Version> in src/Mod/KSAMultiplayer.csproj: package.sh names the
# zip from the project, so a tag that disagrees would publish a zip of another name.
#
# The mod needs KSA's copyrighted assemblies, so this needs KSA_ASSEMBLIES_KEY: a read-only deploy
# key for a repository holding them. Without it nothing here can compile the mod, and a release has
# to be made by hand from a machine that has the game.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  mod:
    name: The mod a player installs
    runs-on: ubuntu-latest
    env:
      HAVE_KEY: ${{ secrets.KSA_ASSEMBLIES_KEY != '' }}
    outputs:
      ksa_build: ${{ steps.facts.outputs.ksa_build }}
      protocol: ${{ steps.facts.outputs.protocol }}
    steps:
      - uses: actions/checkout@v7

      # Said before the checkout below, which without a key fails on a 404 from the API that says
      # nothing about why: the key is never sent, so the private repository is simply not there.
      - name: The assemblies key is set
        if: env.HAVE_KEY != 'true'
        run: |
          echo "::error::KSA_ASSEMBLIES_KEY is not set, so the mod cannot be compiled here. Set it to a read-only deploy key for the assemblies repository, or build the zip with tools/package.sh on a machine that has the game and attach it to the release by hand."
          exit 1

      # CI skips the mod without the key; a release must not. A release with no zip in it is the
      # thing this workflow is for.
      - uses: actions/checkout@v7
        with:
          repository: LaurensDeV/ksa-game-assemblies
          path: .ksa-assemblies
          ssh-key: ${{ secrets.KSA_ASSEMBLIES_KEY }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: The tag is the version in the project
        run: |
          tagged=${GITHUB_REF_NAME#v}
          project=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Mod/KSAMultiplayer.csproj)
          if [[ "$tagged" != "$project" ]]; then
              echo "::error::tag $GITHUB_REF_NAME against <Version>$project</Version> in src/Mod/KSAMultiplayer.csproj"
              exit 1
          fi

      - name: Package
        env:
          KSA_DLL_DIR: ${{ github.workspace }}/.ksa-assemblies/current/dll
        run: ./tools/package.sh

      # What a player has to match: the build the mod was compiled against, and the version it speaks.
      - id: facts
        name: What it was built against
        run: |
          {
              echo "ksa_build=$(cat .ksa-assemblies/current/KSA_BUILD)"
              echo "protocol=$(grep -oP 'const ushort Version = \K[0-9]+' src/Protocol/Wire.cs)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: mod
          path: dist/*.zip
          if-no-files-found: error

  server:
    name: The server a host runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: ./tools/test.sh

      # Both Linux architectures, since a hobby server is as likely to be an ARM box as an x86 one,
      # and Windows, because the machine a player already has is the one they will host on first.
      # A tarball loses nothing on Linux and a zip is what Windows opens without being told how.
      - name: Publish
        run: |
          for rid in linux-x64 linux-arm64; do
              ./tools/publish-server.sh "$rid"
              tar czf "dist/ksamp-server-$rid.tar.gz" -C "dist/ksamp-server-$rid" .
          done
          # python3 rather than zip, as tools/package.sh does: it is there on any machine that can
          # run these scripts, and zip is not -- a release built by hand on a developer's box fails
          # on it otherwise.
          ./tools/publish-server.sh win-x64
          python3 -c "import shutil; shutil.make_archive('dist/ksamp-server-win-x64', 'zip', 'dist/ksamp-server-win-x64')"

      - uses: actions/upload-artifact@v7
        with:
          name: server
          # Named, not dist/*.zip: the mod's zip is built in another job but lands in the same folder
          # name, and an artifact that quietly carried both would publish the mod twice.
          path: |
            dist/ksamp-server-*.tar.gz
            dist/ksamp-server-*.zip
          if-no-files-found: error

  image:
    name: The server as an image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built here rather than taken from the Server image workflow: that one runs on pushes to main
      # and only when the server's own files change, so the commit a tag sits on may have no image.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ksamp-server
          tags: |
            type=ref,event=tag
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish
    needs: [mod, server, image]
    runs-on: ubuntu-latest
    steps:
      # The whole history and every tag, because the notes below are written out of them: a shallow
      # clone has neither the release commit's body nor the tag before this one to count from.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # One step each, named: the image build uploads a record of itself as an artifact too, and
      # downloading everything meant the release fell over fetching a file nobody asked for. Named
      # outright rather than matched, so this does not rest on which glob dialect the action speaks.
      - uses: actions/download-artifact@v8
        with:
          name: mod
          path: assets
      - uses: actions/download-artifact@v8
        with:
          name: server
          path: assets

      - name: Write the notes
        env:
          PROTOCOL: ${{ needs.mod.outputs.protocol }}
          KSA_BUILD: ${{ needs.mod.outputs.ksa_build }}
          DIGEST: ${{ needs.image.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Docker refuses a repository name with a capital in it, and this is the line a host copies.
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')

          # What the release is, in its own words. Every release already has that prose written: it
          # is the body of the chore(release) commit the tag sits on, and until now it stayed in the
          # history where nobody reading the release page would find it.
          WHATS_NEW=$(git log -1 --format=%b "$GITHUB_REF_NAME")

          # Then the bare list, folded away, for whoever wants what changed rather than the story.
          # The release commit itself is left out of it: it is the story, and it is directly above.
          PREVIOUS=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          CHANGELOG=""
          if [[ -n "$PREVIOUS" ]]; then
              list=$(git log --no-merges --format='- %s' "$PREVIOUS..$GITHUB_REF_NAME" | grep -v '^- chore(release)' || true)
              CHANGELOG=$(printf '<details>\n<summary>Every change since %s</summary>\n\n%s\n</details>' "$PREVIOUS" "$list")
          fi

          cat > notes.md <<NOTES
          A shared world for Kitten Space Agency: several players, each in their own game, flying in
          one universe kept by a dedicated server that runs on Linux with no game installed.

          Everyone in a world needs **KSA \`$KSA_BUILD\`** and a mod of this release. A game and a
          server speaking different versions refuse each other by name rather than misread the
          bytes, and this one speaks **protocol $PROTOCOL**.

          ## What's new

          $WHATS_NEW

          $CHANGELOG

          ## Playing

          Install [StarMap](https://github.com/StarMapLoader/StarMap), unzip \`KSAMultiplayer-*.zip\`
          into KSA's \`mods\` folder and enable it. The **PLAY MULTIPLAYER** window comes up before
          anything else: pick a server from the list it shows, or type an address, and press
          **CONNECT**.

          There is a server at **\`mp.ksarmory.com\`** to try it on.

          Hold **Tab** for who is playing and their ping, **Enter** for a chat line. A craft someone
          else is flying carries their name and is theirs: you can watch it, not fly it. Changing the
          simulation speed is put to everyone first, and only whoever asked can end the warp.

          ## Hosting

          \`\`\`bash
          docker run -dit --name ksamp -p 50100:50100/udp -v ksamp-world:/data \\
              -e KSAMP_NAME="My server" ghcr.io/$OWNER/ksamp-server@$DIGEST
          \`\`\`

          Or an executable from below, needing no .NET and no KSA:
          \`ksamp-server-linux-x64.tar.gz\` (with a systemd unit beside it),
          \`ksamp-server-linux-arm64.tar.gz\` for a Pi or an ARM VPS, or
          \`ksamp-server-win-x64.zip\` to run \`ksamp-server.exe\` on the machine you already have.
          The server has no world until a player gives it one, and hands that world to everyone who
          joins after -- or set \`empty-world\` and it starts with one of its own.

          Hosting on the same machine you play on works: the server is its own process and needs no
          game. Whoever else joins needs the port open to them.

          Its commands are typed into its console, which is standard input -- hence \`-it\` above, and
          \`docker attach ksamp\` to reach it, Ctrl+P Ctrl+Q to leave it running. \`clear\` is the broom
          for a world filling up with spent stages: every craft nobody is flying goes, out of every
          game and not just out of the server, and \`clear Rocket_*\` narrows it. \`reload\` hands the
          world out again, which takes a few seconds and no reconnection, and is the only thing that
          ever puts universe time back.

          ## Upgrading a server when KSA has

          A world remembers the KSA build of whoever gave it to the server, and the server turns away
          anyone running a different one. So the day KSA updates, a world seeded before it refuses
          **everybody who updates** -- and nothing says so from inside the game beyond the refusal.
          Either \`fresh\` at the console, which throws that world away and starts an empty one, or
          \`set ksa-build <the new build>\` to make the operator's word the test instead of the
          world's. A world the server started by itself records no build and turns nobody away.

          ## State

          Two games on one machine have flown in one world through it: launching, EVA, chat, the
          scoreboard, nametags, a voted time warp, and an 89-part rocket staged while the other game
          watched and rebuilt the stage it dropped. Another player's engines are seen to burn even on
          a craft this game is not simulating, 7,576 km away. What two games across the internet do
          is not known yet.
          NOTES
          cat notes.md

      # Re-runnable: a release already there is brought up to date rather than refused, so a tag
      # whose run failed halfway can be run again instead of being retired for a tag of its own.
      # Run the whole thing again, not the failed job: download-artifact sees only the attempt it
      # runs in, so a job rerun finds nothing from the jobs that passed the first time.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
              gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          else
              gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md assets/*
          fi

  directory:
    name: The directory as an image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built here rather than taken from the Directory image workflow, for the reason the server's
      # is: that one runs on pushes to main and only when its own files change, so the commit a tag
      # sits on may have no image. It is also built from the same tree as the server, which matters
      # more here than anywhere -- a directory reads a welcome in the protocol version it was built
      # against, so one built from another commit lists nothing and says so in every server's log.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ksamp-directory
          tags: |
            type=ref,event=tag
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.directory
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Whether the server behind mp.ksarmory.com updates itself. A job of its own because a job's `if`
  # cannot read secrets, and a release must not fail on a repository that has none of these set: a
  # fork, or this one before the secrets were added.
  deployable:
    name: Whether this deploys itself
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.secrets.outputs.ok }}
    steps:
      - id: secrets
        env:
          HAVE: ${{ secrets.DEPLOY_SSH_KEY != '' && secrets.TF_STATE_ACCESS_KEY != '' }}
        run: |
          echo "ok=$HAVE" >> "$GITHUB_OUTPUT"
          [[ "$HAVE" == "true" ]] || echo "::notice::DEPLOY_SSH_KEY and the TF_STATE_* secrets are not set, so nothing was deployed. The release itself is complete; apply infra/server by hand to put it on the machine."

  # The machine runs what this release built, by digest, without anybody copying one. OpenTofu owns
  # the container, so this is the same apply an operator would run, with the same state: deploying
  # another way would leave that state describing a container that is no longer there.
  deploy:
    name: The server behind mp.ksarmory.com
    needs: [image, directory, publish, deployable]
    if: needs.deployable.outputs.ok == 'true'
    runs-on: ubuntu-latest
    # One at a time with the Worlds workflow, which writes the same state.
    concurrency:
      group: infra-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.9.0"

      - name: The key, and the state's credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_ENDPOINT: ${{ secrets.TF_STATE_ENDPOINT }}
          TF_STATE_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}
          TF_STATE_SECRET_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          umask 077
          cat > infra/server/backend.hcl <<BACKEND
          bucket     = "$TF_STATE_BUCKET"
          endpoints  = { s3 = "$TF_STATE_ENDPOINT" }
          access_key = "$TF_STATE_ACCESS_KEY"
          secret_key = "$TF_STATE_SECRET_KEY"
          BACKEND

      # The digest this run built, not a tag: the machine runs the image that was made here, which is
      # the whole reason the variable takes a digest.
      - name: Apply
        working-directory: infra/server
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ needs.image.outputs.digest }}
          DIRECTORY_DIGEST: ${{ needs.directory.outputs.digest }}
          TF_VAR_ssh_private_key: ~/.ssh/deploy
          TF_IN_AUTOMATION: "1"
          # The other worlds on the machine, as infra/server's `worlds` takes them: a repository
          # variable, since they are not secret and a release that did not know of them would
          # plan to take their containers away -- and fail on their volumes, which it may not.
          WORLDS: ${{ vars.KSAMP_WORLDS }}
        run: |
          if [[ -n "$WORLDS" ]]; then export TF_VAR_worlds="$WORLDS"; fi
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          export TF_VAR_server_image="ghcr.io/$owner/ksamp-server@$DIGEST"
          # The two go up together on purpose: a directory lists a server only in the protocol
          # version it was itself built against, so a release that moved one and not the other is a
          # directory that lists nothing.
          export TF_VAR_directory_image="ghcr.io/$owner/ksamp-directory@$DIRECTORY_DIGEST"
          tofu init -backend-config=backend.hcl
          tofu apply -auto-approve
          {
              echo "### Deployed"
              echo
              echo "\`$(tofu output -raw address)\` now runs \`$TF_VAR_server_image\`."
              echo
              echo "The directory runs \`$TF_VAR_directory_image\` at $(tofu output -raw directory)."
              echo
              echo "Players need a mod of this release: a game of another version is refused by name."
          } >> "$GITHUB_STEP_SUMMARY"
