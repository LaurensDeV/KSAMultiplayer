# KSAMultiplayer's, from its infra/server/ops.tf: the ops user, which reaches the KSA server
# containers and nothing else on this machine. Give it nothing more; anything else wants its own.
#
# The key lines in /etc/ssh/authorized_keys/ops say `restrict` and force the same command, so either
# this file or those lines alone keeps an operator to ksamp-ops.
Match User ops
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    DisableForwarding yes
    # A terminal, for the prompt: nothing run as root is ever handed it (ksamp-ops-root reads what
    # Docker and the journal say through a pipe, so neither ever pages through less).
    PermitTTY yes
    PermitTunnel no
    PermitUserRC no
    # How ksamp-ops knows which operator's key this is.
    ExposeAuthInfo yes
    ForceCommand /usr/local/sbin/ksamp-ops
# OpenSSH 10.2 ends a Match with the file it is in; this ends it on an sshd that reads on into the
# rest of sshd_config, whose Include is at the top.
Match all
