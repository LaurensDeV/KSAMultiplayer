<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--card--><title>KSA Multiplayer servers</title>
<meta name="description" content="Every public KSA Multiplayer server, from all directories, and the mods each one needs."><!--/card-->
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f17'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f2b33d'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='5' fill='none' stroke='%23f2b33d' stroke-width='1.6' transform='rotate(-25 16 16)'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0b0f17; --bg2: #101623; --panel: #141b2a; --panel2: #1a2335; --line: #26314a;
  --text: #e7ecf5; --muted: #93a0b8; --faint: #66728a;
  --accent: #f2b33d; --accent-ink: #1b1300; --good: #6fd08c; --warn: #f2b33d; --bad: #f0786b;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f6fa; --bg2: #eceff5; --panel: #ffffff; --panel2: #f3f5f9; --line: #d9dfea;
    --text: #131a27; --muted: #55627a; --faint: #8490a6;
    --accent: #b97700; --accent-ink: #ffffff; --good: #1f8a45; --warn: #a86a00; --bad: #c23b2e;
  }
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; color: var(--text); font: 16px/1.5 var(--sans);
  background: radial-gradient(1100px 520px at 85% -10%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%), var(--bg);
}
a { color: inherit; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
header.top { border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 82%, transparent); position: sticky; top: 0; z-index: 5; backdrop-filter: blur(8px); }
header.top .wrap { display: flex; align-items: center; gap: 14px; height: 58px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 650; letter-spacing: .01em; }
.brand svg { width: 26px; height: 26px; flex: none; }
.brand small { color: var(--muted); font-weight: 500; }
.top .grow { flex: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 14px; font-weight: 600;
  text-decoration: none; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { padding: 13px 18px; font-size: 15px; letter-spacing: .03em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

main { padding: 30px 0 70px; }
h1 { font-size: clamp(26px, 4.4vw, 38px); line-height: 1.15; margin: 0 0 8px; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 34px 0 12px; font-weight: 650; }
p.lede { color: var(--muted); margin: 0; max-width: 62ch; }
.bar { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; margin: 26px 0 14px; }
.stat { color: var(--muted); font-size: 14px; }
.stat b { color: var(--text); font-variant-numeric: tabular-nums; }
.search { flex: 1 1 220px; max-width: 340px; margin-left: auto; }
.search input {
  width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 14px;
}
.search input::placeholder { color: var(--faint); }

.rows { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
a.row {
  display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 6px 18px; align-items: center;
  padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; text-decoration: none;
  transition: border-color .12s, background .12s, transform .12s;
}
a.row:hover { border-color: var(--accent); background: var(--panel2); }
.row .name { font-weight: 650; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .where, .mono { font-family: var(--mono); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row .world { color: var(--muted); font-size: 14px; }
.row .label { display: none; }
.row .mods { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); font-size: 14px; }
.row .mods span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icons { display: flex; flex: none; }
.icons .icon { width: 26px; height: 26px; border-radius: 6px; margin-left: -6px; box-shadow: 0 0 0 2px var(--panel); }
.icons .icon:first-child { margin-left: 0; }
.who { text-align: right; white-space: nowrap; display: flex; align-items: baseline; gap: 10px; justify-content: flex-end; }
.count { font-variant-numeric: tabular-nums; font-weight: 650; }
.count.none { color: var(--faint); font-weight: 500; }
.count.some { color: var(--good); }
.pill {
  display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1.5;
  border: 1px solid color-mix(in srgb, currentColor 45%, transparent); white-space: nowrap;
}
.pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.muted { color: var(--muted); }

.icon { display: inline-grid; place-items: center; overflow: hidden; background: var(--panel2); color: var(--muted); font-weight: 700; font-size: 11px; flex: none; }
.icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

.note { padding: 18px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); }
.note.bad { border-color: color-mix(in srgb, var(--bad) 60%, transparent); }

/* One server */
.back { display: inline-block; color: var(--muted); text-decoration: none; font-size: 14px; margin-bottom: 18px; }
.back:hover { color: var(--text); }
.head { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; }
.head > div:first-child { flex: 1 1 320px; min-width: 0; }
.address { display: inline-flex; align-items: center; gap: 10px; margin-top: 8px; padding: 6px 6px 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.address code { font-family: var(--mono); font-size: 15px; }
.address button { padding: 5px 10px; font-size: 13px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 26px 0 0; }
.fact { padding: 13px 16px; min-width: 0; box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line); }
.fact dt { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--faint); margin: 0 0 3px; }
.fact dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.fact dd small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }

.get { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; padding: 18px; border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 10px; background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
.get p { margin: 0; flex: 1 1 320px; color: var(--muted); font-size: 14px; }
.get p b { color: var(--text); }

.cards { display: grid; gap: 10px; list-style: none; margin: 0; padding: 0; }
.card { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 16px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.card .icon { width: 72px; height: 72px; border-radius: 12px; font-size: 22px; }
.card h3 { margin: 0; font-size: 18px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.card h3 .by { font-size: 13px; font-weight: 400; color: var(--muted); }
.card .wants { margin: 5px 0 0; font-size: 14px; }
.card .wants b { font-family: var(--mono); font-size: 13px; padding: 1px 7px; border-radius: 5px; background: var(--panel2); border: 1px solid var(--line); }
.card .about { margin: 8px 0 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
.card .links { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 14px; }
.card .links a { color: var(--accent); text-decoration: none; }
.card .links a:hover { text-decoration: underline; }
.steps { margin: 0; padding-left: 22px; color: var(--muted); max-width: 70ch; }
.steps li { margin: 4px 0; } .steps b { color: var(--text); }

footer { border-top: 1px solid var(--line); color: var(--faint); font-size: 13px; padding: 18px 0 40px; }
footer a { color: var(--muted); }

@media (max-width: 760px) {
  a.row { grid-template-columns: minmax(0, 1fr) auto; }
  .row .world, .row .mods { grid-column: 1 / -1; }
  .row .world { display: none; }
  .search { max-width: none; margin-left: 0; }
  .card { grid-template-columns: 52px minmax(0, 1fr); gap: 12px; }
  .card .icon { width: 52px; height: 52px; }
  .brand small { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="5" fill="var(--accent)"/><ellipse cx="16" cy="16" rx="13" ry="5.2" fill="none" stroke="var(--accent)" stroke-width="1.6" transform="rotate(-25 16 16)"/><circle cx="27" cy="9.5" r="1.8" fill="var(--text)"/></svg>
      <span>KSA Multiplayer <small>servers</small></span>
    </a>
    <span class="grow"></span>
    <a class="btn" href="https://ksamodding.github.io/Borea/mod/KSAMultiplayer/" rel="noopener">Get the mod</a>
  </div>
</header>
<main><div class="wrap" id="view" aria-live="polite"></div></main>
<footer><div class="wrap">
  A shared world for Kitten Space Agency. Mod details and pictures come from the
  <a href="https://ksamodding.github.io/Borea/" rel="noopener">Borea</a> mod index.
  This list as data: <a href="/v1/all">v1/all</a> ·
  <a href="https://github.com/LaurensDeV/KSAMultiplayer" rel="noopener">Source</a>
</div></footer>
<noscript><div class="wrap"><p class="note">This page builds the list with a script. The same list as data is at <a href="/v1/all">v1/all</a>.</p></div></noscript>

<script>
"use strict";
// Everything a server or a directory says is a stranger's text. It reaches the page through
// textContent and through attributes checked first, and never as markup.

const LIST = "/v1/all";
// A server's page is an address of its own, so that a link to it can say whose it is.
const UNDER = "/s/";
const INDEX = "https://ksamodding.github.io/content-index-releases/v1/index.json";
const MOD_PAGE = "https://ksamodding.github.io/Borea/mod/";
const DEFAULT_PORT = 50100;
const OURS = "ksamultiplayer", CORE = "core";
const REFRESH_MS = 30000;
// What KSA's own list of systems calls them, for the ones it ships with.
const SYSTEMS = { SolLite: "Earth and Moon" };

const view = document.getElementById("view");
const state = { all: null, failed: false, index: null, indexFailed: false, at: 0, filter: "" };

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) e.append(kid);
  return e;
}
const web = u => typeof u === "string" && /^https:\/\//i.test(u) ? u : null;

// ---- what a listing says ----

const where = s => s.port === DEFAULT_PORT || s.srv ? s.host : `${s.host}:${s.port}`;
const key = s => `${s.host}:${s.port}`.toLowerCase();
const said = s => s.name || where(s);

function mods(s) {
  return String(s.mods || "").split(",").map(e => e.trim()).filter(Boolean).map(e => {
    const at = e.indexOf("@");
    const id = (at < 0 ? e : e.slice(0, at)).trim(), version = at < 0 ? "" : e.slice(at + 1).trim();
    return { id, version };
  }).filter(m => m.id);
}
const extras = s => mods(s).filter(m => ![CORE, OURS].includes(m.id.toLowerCase()));

// ---- the mod index ----

function listing(id) {
  return state.index?.get(id.toLowerCase()) || null;
}
function newest(l) {
  const by = (a, b) => String(b.release_date || "").localeCompare(String(a.release_date || ""));
  const all = [...(l?.releases || [])].sort(by);
  return all.find(r => r.release_status === "stable") || all[0] || null;
}
const VERSION = /^(\d+\.\d+\.\d+)(?:\.0)?(-[0-9A-Za-z.-]+)?$/;
function release(version) {
  let v = String(version || "").trim();
  const plus = v.indexOf("+");
  if (plus >= 0) v = v.slice(0, plus);
  const m = VERSION.exec(v);
  return m ? m[1] + (m[2] || "") : null;
}
const commit = version => { const p = String(version).indexOf("+"); return p < 0 ? "" : String(version).slice(p + 1, p + 8); };
function has(l, wanted) {
  return (l?.releases || []).find(r => release(r.version) === wanted) || null;
}
function newer(a, b) {
  const x = String(a).split(/[.-]/).map(Number), y = String(b).split(/[.-]/).map(Number);
  for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0);
  return false;
}
function bytes(n) {
  return n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : n >= 1024 ? `${Math.round(n / 1024)} KB` : `${n} bytes`;
}

// ---- the link Borea opens: the same one the game makes, from the same parts ----

const ID = /^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,62}[A-Za-z0-9])?$/;
function linkName(name) {
  let plain = [...String(name)].filter(c => c >= " " && c <= "~").join("").trim();
  if (plain.length > 64) plain = plain.slice(0, 64).trimEnd();
  return [...plain].map(c => c === " " ? "+" : /[A-Za-z0-9._~-]/.test(c) ? c
    : "%" + c.charCodeAt(0).toString(16).toUpperCase().padStart(2, "0")).join("");
}
function linkId(s) {
  if (s.id && s.id.length <= 58 && ID.test(s.id)) return "ksamp-" + s.id;
  let id = "ksamp-";
  for (const c of where(s).trim().toLowerCase()) {
    if (/[a-z0-9._]/.test(c)) id += c;
    else if (!id.endsWith("-")) id += "-";
  }
  id = id.slice(0, 64).replace(/[^a-z0-9]+$/, "");
  return id.length > 6 ? id : "";
}
// The link, or the reason there is none. Borea refuses the whole of a link it does not like,
// so one that cannot say what the server wants is not offered.
function modsLink(s) {
  if (!state.index) return { why: state.indexFailed ? "the mod index could not be read" : "reading the mod index" };
  const parts = [], seen = new Set();
  for (const m of mods(s)) {
    const lower = m.id.toLowerCase();
    if (lower === CORE || seen.has(lower)) continue;
    seen.add(lower);
    const l = listing(m.id);
    if (!ID.test(m.id) || !l) return { why: `${m.id} is not in the mod index` };
    const wanted = m.version ? release(m.version) : release(newest(l)?.version);
    if (!wanted) return { why: `${m.id} has no release a link can name` };
    if (!has(l, wanted)) return { why: `${m.id} ${wanted} is not in the mod index` };
    parts.push(`${l.id}@${wanted}`);
  }
  if (parts.length === 0) return { why: "" };
  if (parts.length > 100) return { why: "the list of mods is too long for a link" };
  let link = "borea://modlist?mods=" + parts.join(",");
  const name = linkName(s.name || ""), id = linkId(s);
  if (name) link += "&name=" + name;
  if (id) link += "&id=" + id;
  return link.length <= 2048 ? { link } : { why: "the list of mods is too long for a link" };
}

// ---- pieces ----

function icon(id) {
  const l = listing(id), url = web(l?.authored?.images?.icon?.url);
  const letters = (l?.authored?.name || id).replace(/[^A-Za-z0-9 ]/g, "").split(/\s+|(?<=[a-z])(?=[A-Z])/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
  const box = h("span", { class: "icon", title: l?.authored?.name || id, "aria-hidden": "true" }, letters || "?");
  if (url) {
    const img = h("img", { src: url, alt: "", loading: "lazy", referrerpolicy: "no-referrer" });
    img.addEventListener("load", () => box.replaceChildren(img));
  }
  return box;
}
function pills(s) {
  return [
    s.password && h("span", { class: "pill warn" }, "password"),
    s.max > 0 && s.players >= s.max && h("span", { class: "pill bad" }, "full"),
  ];
}
function players(s) {
  const n = s.players || 0;
  return h("span", { class: `count ${n > 0 ? "some" : "none"}` }, s.max > 0 ? `${n} / ${s.max}` : String(n));
}
const world = s => s.system ? SYSTEMS[s.system] || s.system : "The player's choice";
function ago(seen) {
  if (!seen) return "";
  const d = Math.max(0, Math.round(Date.now() / 1000 - seen));
  return d < 90 ? `${d} s ago` : d < 5400 ? `${Math.round(d / 60)} min ago` : `${Math.round(d / 3600)} h ago`;
}

// ---- the list ----

function listView() {
  document.title = "KSA Multiplayer servers";
  const head = [
    h("h1", {}, "Find a world to fly in"),
    h("p", { class: "lede" }, "Every public KSA Multiplayer server, from all the directories. Pick one to see what it needs, then join it from the game's own server list or by typing its address."),
  ];
  if (!state.all) {
    return [...head, h("p", { class: `note ${state.failed ? "bad" : ""}`, style: "margin-top:26px" },
      state.failed ? "The list could not be read just now. It is asked again every half minute." : "Reading the list…")];
  }
  const rows = state.all.servers.map(c => c.listed);
  const online = rows.reduce((n, s) => n + (s.players || 0), 0);
  const list = h("ul", { class: "rows" }, items());
  const search = h("input", { type: "search", placeholder: "Search servers and mods", value: state.filter, "aria-label": "Search servers and mods",
    oninput: e => { state.filter = e.target.value; list.replaceChildren(...items()); } });
  return [
    ...head,
    h("div", { class: "bar" },
      h("span", { class: "stat" }, h("b", {}, String(rows.length)), rows.length === 1 ? " server" : " servers"),
      h("span", { class: "stat" }, h("b", {}, String(online)), online === 1 ? " player online" : " players online"),
      h("span", { class: "stat" }, "listed by ", state.all.directories.join(", ") || "nobody"),
      h("label", { class: "search" }, search)),
    list,
  ];
}

// The rows the search box leaves, from the list as it stands now.
function items() {
  const rows = state.all.servers.map(c => c.listed), q = state.filter.trim().toLowerCase();
  const now = !q ? rows : rows.filter(s =>
    [s.name, s.host, s.system, world(s), s.mods, ...mods(s).map(m => listing(m.id)?.authored?.name || "")]
      .some(t => String(t || "").toLowerCase().includes(q)));
  if (now.length === 0) return [h("li", { class: "note" }, rows.length === 0 ? "No server is listed right now." : "No server matches that.")];
  return now.map(row);
}

function row(s) {
  const more = extras(s);
  const names = more.map(m => listing(m.id)?.authored?.name || m.id);
  return h("li", {}, h("a", { class: "row", href: UNDER + encodeURIComponent(where(s)) },
    h("div", {}, h("div", { class: "name" }, said(s)), h("div", { class: "where" }, where(s))),
    h("div", { class: "world" }, world(s)),
    h("div", { class: "mods" },
      more.length > 0 && h("span", { class: "icons" }, more.slice(0, 4).map(m => icon(m.id))),
      h("span", {}, more.length === 0 ? "No extra mods" : names.join(", "))),
    h("div", { class: "who" }, pills(s), players(s))));
}

// ---- one server ----

function fact(label, value, small) {
  return h("div", { class: "fact" }, h("dt", {}, label), h("dd", {}, value, small && h("small", {}, small)));
}

function card(m) {
  const l = listing(m.id), a = l?.authored;
  const wanted = m.version ? release(m.version) || m.version : "";
  const latest = l ? release(newest(l)?.version) : null;
  const rel = l ? (wanted ? has(l, wanted) : newest(l)) : null;
  const build = commit(m.version);
  const links = [
    l && h("a", { href: MOD_PAGE + encodeURIComponent(l.id) + "/", rel: "noopener" }, "Mod page"),
    web(rel?.download?.url) && h("a", { href: web(rel.download.url), rel: "noopener" },
      `Download ${release(rel.version) || ""}`.trim() + (rel.download.size ? ` (${bytes(rel.download.size)})` : "")),
    web(a?.links?.repository) && h("a", { href: web(a.links.repository), rel: "noopener" }, "Source"),
    web(a?.links?.forums) && h("a", { href: web(a.links.forums), rel: "noopener" }, "Forum thread"),
  ].filter(Boolean);
  return h("li", { class: "card" },
    icon(m.id),
    h("div", {},
      h("h3", {}, a?.name || m.id, a?.authors?.length > 0 && h("span", { class: "by" }, "by " + a.authors.join(", "))),
      h("p", { class: "wants" }, wanted
        ? ["This server wants release ", h("b", {}, wanted), build && ` (build ${build})`,
           l && !has(l, wanted) && h("span", { class: "pill warn", style: "margin-left:8px" }, "not in the mod index")]
        : ["Any version", latest && [" — the latest is ", h("b", {}, latest)]]),
      a?.abstract && h("p", { class: "about" }, a.abstract),
      !l && h("p", { class: "about" }, state.index ? "This mod is not in the Borea mod index, so there is nothing more to show about it. Ask whoever runs the server where to get it."
        : state.indexFailed ? "The mod index could not be read, so there is nothing more to show about it." : "Reading the mod index…"),
      links.length > 0 && h("div", { class: "links" }, links)));
}

function serverView(id) {
  const c = state.all?.servers.find(c => where(c.listed).toLowerCase() === id || key(c.listed) === id);
  const back = h("a", { class: "back", href: "/" }, "← All servers");
  if (!state.all) return [back, h("p", { class: `note ${state.failed ? "bad" : ""}` }, state.failed ? "The list could not be read just now." : "Reading the list…")];
  if (!c) {
    document.title = "Not listed — KSA Multiplayer servers";
    return [back, h("h1", {}, "That server is not listed"),
      h("p", { class: "lede" }, "It may have stopped, or stopped listing itself. A server leaves the list a few minutes after it goes quiet.")];
  }
  const s = c.listed, all = mods(s), needed = all.filter(m => m.id.toLowerCase() !== CORE);
  document.title = `${said(s)} — KSA Multiplayer servers`;

  const copy = h("button", { class: "btn", type: "button", onclick: async () => {
    try { await navigator.clipboard.writeText(where(s)); copy.textContent = "Copied"; } catch { copy.textContent = "Select and copy"; }
    setTimeout(() => copy.textContent = "Copy", 1600);
  } }, "Copy");

  const loaders = needed.map(m => listing(m.id)?.authored?.loader).filter(x => x?.id && x.min);
  const loader = loaders.reduce((best, x) => !best || newer(x.min, best.min) ? x : best, null);
  const got = modsLink(s);

  return [
    back,
    h("div", { class: "head" },
      h("div", {},
        h("h1", {}, said(s)),
        h("div", { class: "address" }, h("code", {}, where(s)), copy)),
      h("div", { class: "who" }, pills(s), h("span", { style: "font-size:22px" }, players(s)), h("span", { class: "stat" }, "online"))),
    h("dl", { class: "facts" },
      fact("World", world(s), s.system && SYSTEMS[s.system] ? s.system : null),
      fact("KSA build", s.ksa || "Not said", s.ksa ? "Your game has to be on this build" : null),
      fact("Password", s.password ? "Needed" : "None"),
      loader && fact("Mod loader", `${loader.id} ${loader.min} or later`),
      fact("Listed by", c.by.join(", ") || "—", s.seen ? `answered ${ago(s.seen)}` : null),
      fact("Protocol", String(s.protocol || "—"), "The mod and the server have to speak the same")),

    h("h2", {}, "How to join"),
    h("ol", { class: "steps" },
      h("li", {}, "Have the mods below, at the releases this server wants. A server turns away a game that is missing one, and may turn away a game with mods it does not have itself."),
      h("li", {}, "Start KSA and open ", h("b", {}, "Multiplayer"), ". Pick ", h("b", {}, said(s)), " from the list, or type ", h("b", { class: "mono" }, where(s)), " into the Server box."),
      h("li", {}, "Press ", h("b", {}, "CONNECT"), s.password ? ". You will be asked for the server's password." : ".")),

    h("h2", {}, needed.length === 0 ? "Mods" : `Mods this server needs (${needed.length})`),
    got.link && h("div", { class: "get", style: "margin-bottom:12px" },
      h("a", { class: "btn primary big", href: got.link }, "GET THESE MODS WITH BOREA"),
      h("p", {}, h("b", {}, "One click, if you use Borea 0.6.20 or later. "),
        "Borea shows the list and, when you say so, makes a separate instance of the game with exactly these mods. The game you play in now is left as it is.")),
    !got.link && got.why && needed.length > 0 && h("p", { class: "note", style: "margin-bottom:12px" },
      `There is no one-click install for this server: ${got.why}.`),
    needed.length === 0
      ? h("p", { class: "note" }, String(s.mods || "").trim() ? "This server needs no mods beyond the game's own content." : "This server has not said which mods it wants.")
      : h("ul", { class: "cards" }, needed.map(card)),
  ];
}

// ---- reading, and drawing again ----

function draw() {
  const route = location.pathname.startsWith(UNDER) ? decodeURIComponent(location.pathname.slice(UNDER.length)).toLowerCase() : "";
  // A list being typed into is left alone by a refresh: its rows are redrawn and its box is not.
  const typing = !route && document.activeElement?.type === "search";
  if (typing) {
    const list = view.querySelector(".rows");
    if (list && state.all) { list.replaceChildren(...items()); return; }
  }
  view.replaceChildren(...(route ? serverView(route) : listView()).filter(Boolean));
}

async function readList() {
  try {
    const r = await fetch(LIST, { headers: { Accept: "application/json" } });
    if (!r.ok) throw new Error(String(r.status));
    const all = await r.json();
    if (all?.v !== 1 || !Array.isArray(all.servers)) throw new Error("shape");
    all.servers = all.servers.filter(c => c?.listed?.host && Number.isInteger(c.listed.port));
    for (const c of all.servers) c.by = Array.isArray(c.by) ? c.by.map(String) : [];
    all.directories = Array.isArray(all.directories) ? all.directories.map(String) : [];
    [state.all, state.failed, state.at] = [all, false, Date.now()];
  } catch {
    state.failed = true;
  }
  draw();
}

async function readIndex() {
  try {
    const r = await fetch(INDEX);
    if (!r.ok) throw new Error(String(r.status));
    const index = await r.json();
    state.index = new Map((index.listings || []).filter(l => typeof l?.id === "string").map(l => [l.id.toLowerCase(), l]));
  } catch {
    state.indexFailed = true;
  }
  draw();
}

// A link within the page changes the address and draws again, without the page being fetched
// a second time for the sake of the tags in its head.
document.addEventListener("click", e => {
  const a = e.target.closest?.("a[href]");
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const to = a.getAttribute("href");
  if (to !== "/" && !to.startsWith(UNDER)) return;
  e.preventDefault();
  if (to !== location.pathname) history.pushState(null, "", to);
  draw();
  scrollTo(0, 0);
});
addEventListener("popstate", draw);
draw();
readList();
readIndex();
setInterval(() => { if (!document.hidden) readList(); }, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - state.at > REFRESH_MS) readList(); });
</script>
</body>
</html>
