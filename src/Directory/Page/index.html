<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--card--><title>KSA Multiplayer servers</title>
<meta name="description" content="Every public KSA Multiplayer server, from all directories, and the mods each one needs."><!--/card-->
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f17'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%233d7bfa'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='5' fill='none' stroke='%233d7bfa' stroke-width='1.6' transform='rotate(-25 16 16)'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f6fb; --panel: #ffffff; --panel2: #f1f4fa; --line: #e1e6f0; --line2: #cfd7e6;
  --text: #0f1728; --muted: #5a6680; --faint: #8893aa;
  --accent: #2563eb; --accent-hi: #1d4fd0; --accent-ink: #ffffff; --accent-soft: #e8effe;
  --good: #15934b; --warn: #b45309; --bad: #c2362b;
  --shadow: 0 1px 2px rgb(15 23 40 / .05), 0 8px 24px -12px rgb(15 23 40 / .12);
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #090d16; --panel: #111827; --panel2: #172033; --line: #212b42; --line2: #2e3a57;
    --text: #e9eef8; --muted: #95a2bb; --faint: #66738e;
    --accent: #3d7bfa; --accent-hi: #5a90ff; --accent-ink: #ffffff; --accent-soft: #16233f;
    --good: #45d483; --warn: #f0b24a; --bad: #f47a6c;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 12px 30px -16px rgb(0 0 0 / .6);
  }
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; color: var(--text); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  background: radial-gradient(900px 420px at 50% -160px, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%) no-repeat, var(--bg);
}
a { color: inherit; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

header.top { border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 80%, transparent); position: sticky; top: 0; z-index: 5; backdrop-filter: blur(10px); }
header.top .wrap { display: flex; align-items: center; gap: 14px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; letter-spacing: -.005em; }
.brand svg { width: 28px; height: 28px; flex: none; }
.brand small { color: var(--muted); font-weight: 500; }
.top .grow { flex: 1; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 14px; border-radius: 9px;
  border: 1px solid var(--line2); background: var(--panel); color: var(--text); font: inherit; font-size: 14px; font-weight: 600;
  text-decoration: none; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover { background: var(--panel2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); box-shadow: 0 6px 18px -8px var(--accent); }
.btn.primary:hover { background: var(--accent-hi); }
.btn.big { padding: 13px 20px; font-size: 16px; border-radius: 11px; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 7px; }

main { padding: 34px 0 72px; }
h1 { font-size: clamp(28px, 4.6vw, 40px); line-height: 1.12; margin: 0; letter-spacing: -.02em; font-weight: 750; text-wrap: balance; overflow-wrap: anywhere; }
h2 { font-size: 20px; letter-spacing: -.01em; margin: 0 0 14px; font-weight: 700; }
p.lede { color: var(--muted); margin: 10px 0 0; max-width: 60ch; font-size: 17px; }
.sub { color: var(--muted); margin: -8px 0 16px; font-size: 15px; }
section { margin-top: 36px; }

/* The list */
.bar { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; margin: 30px 0 14px; }
.tally { display: flex; align-items: baseline; gap: 7px; color: var(--muted); font-size: 15px; }
.tally b { color: var(--text); font-size: 22px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tally.live b { color: var(--good); }
.search { flex: 1 1 220px; max-width: 320px; margin-left: auto; }
.search input {
  width: 100%; padding: 10px 13px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel); color: var(--text); font: inherit; font-size: 14px;
}
.search input::placeholder { color: var(--faint); }

.rows { display: grid; gap: 10px; list-style: none; margin: 0; padding: 0; }
a.row {
  display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, .9fr) minmax(0, 1.2fr) 118px 14px; gap: 6px 20px; align-items: center;
  padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; text-decoration: none; box-shadow: var(--shadow);
  transition: border-color .12s, transform .12s;
}
a.row:hover { border-color: var(--accent); transform: translateY(-1px); }
.row .name { font-weight: 700; font-size: 17px; letter-spacing: -.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .where, .mono { font-family: var(--mono); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row .world { color: var(--muted); font-size: 14px; }
.row .mods { display: flex; align-items: center; gap: 9px; min-width: 0; color: var(--muted); font-size: 14px; }
.row .mods span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .go { color: var(--faint); font-size: 20px; line-height: 1; }
a.row:hover .go { color: var(--accent); }
.icons { display: flex; flex: none; }
.icons .icon { width: 28px; height: 28px; border-radius: 7px; margin-left: -7px; box-shadow: 0 0 0 2px var(--panel); }
.icons .icon:first-child { margin-left: 0; }

/* Players, as a number over how full the server is */
.seats { display: grid; gap: 6px; }
.seats .n { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.seats .n b { font-weight: 750; font-size: 17px; }
.seats .n span { color: var(--faint); font-size: 14px; }
.seats.some .n b { color: var(--good); }
.meter { height: 5px; border-radius: 99px; background: var(--panel2); overflow: hidden; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--good); }
.seats.full .meter i { background: var(--bad); }

.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 650; line-height: 1.5; white-space: nowrap;
  background: color-mix(in srgb, currentColor 12%, transparent);
}
.pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.good { color: var(--good); } .pill.muted { color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 22%, transparent); }

.icon { display: inline-grid; place-items: center; overflow: hidden; background: var(--accent-soft); color: var(--accent); font-weight: 750; font-size: 11px; flex: none; }
.icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

.note { padding: 18px; border: 1px dashed var(--line2); border-radius: 12px; color: var(--muted); }
.note.bad { border-color: color-mix(in srgb, var(--bad) 60%, transparent); }

/* One server */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
.back:hover { color: var(--text); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.hero { overflow: hidden; }
.hero .title { padding: 24px 24px 22px; display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: flex-end; justify-content: space-between; }
.hero .title > div { min-width: 0; }
.hero .status { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.address { display: inline-flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border: 1px solid var(--line2); border-radius: 11px; background: var(--panel2); }
.address code { font-family: var(--mono); font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0; border-top: 1px solid var(--line); background: var(--panel2); }
.fact { padding: 16px 24px; min-width: 0; border-left: 1px solid var(--line); }
.fact:first-child { border-left: 0; }
.fact dt { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .09em; color: var(--faint); margin: 0 0 5px; }
.fact dd { margin: 0; font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
.fact dd small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }
.fact .seats .n b { font-size: 17px; }

.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
.steps > li { counter-increment: step; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 16px; padding: 20px 24px; border-top: 1px solid var(--line); }
.steps > li:first-child { border-top: 0; }
.steps > li::before {
  content: counter(step); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-weight: 750; font-size: 15px;
}
.steps h3 { margin: 4px 0 4px; font-size: 17px; letter-spacing: -.005em; }
.steps p { margin: 0; color: var(--muted); font-size: 15px; max-width: 64ch; }
.steps p b { color: var(--text); font-weight: 650; }
.steps .cta { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; margin-top: 14px; }
.steps .cta small { color: var(--faint); font-size: 13px; flex: 1 1 220px; }
kbd { font-family: var(--mono); font-size: 13px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line2); color: var(--text); white-space: nowrap; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 12px; list-style: none; margin: 0; padding: 0; }
.card { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; padding: 18px; }
.card .icon { width: 64px; height: 64px; border-radius: 14px; font-size: 20px; }
.card h3 { margin: 0; font-size: 17px; letter-spacing: -.005em; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.card .by { margin: 1px 0 0; font-size: 13px; color: var(--faint); }
.chip { font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.any { font-family: var(--sans); background: var(--panel2); color: var(--muted); }
.card .about { margin: 9px 0 0; color: var(--muted); font-size: 14px; }
.card .links { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 14px; font-weight: 600; }
.card .links a { color: var(--accent); text-decoration: none; }
.card .links a:hover { text-decoration: underline; }

footer { border-top: 1px solid var(--line); color: var(--faint); font-size: 13px; padding: 20px 0 44px; }
footer a { color: var(--muted); }

@media (max-width: 760px) {
  a.row { grid-template-columns: minmax(0, 1fr) 96px; padding: 14px 16px; }
  .row .mods { grid-column: 1 / -1; }
  .row .world, .row .go { display: none; }
  .search { max-width: none; margin-left: 0; flex-basis: 100%; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fact { padding: 14px 18px; }
  .fact:nth-child(odd) { border-left: 0; }
  .fact:nth-child(n+3) { border-top: 1px solid var(--line); }
  .hero .title, .steps > li { padding-left: 18px; padding-right: 18px; }
  .steps > li { grid-template-columns: 30px minmax(0, 1fr); gap: 12px; }
  .steps > li::before { width: 30px; height: 30px; }
  .card { grid-template-columns: 48px minmax(0, 1fr); gap: 12px; padding: 16px; }
  .card .icon { width: 48px; height: 48px; border-radius: 11px; }
  .brand small { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="5" fill="var(--accent)"/><ellipse cx="16" cy="16" rx="13" ry="5.2" fill="none" stroke="var(--accent)" stroke-width="1.6" transform="rotate(-25 16 16)"/><circle cx="27" cy="9.5" r="1.8" fill="var(--text)"/></svg>
      <span>KSA Multiplayer <small>servers</small></span>
    </a>
    <span class="grow"></span>
    <a class="btn" href="https://ksamodding.github.io/Borea/mod/KSAMultiplayer/" rel="noopener">Get the mod</a>
  </div>
</header>
<main><div class="wrap" id="view" aria-live="polite"></div></main>
<footer><div class="wrap">
  A shared world for Kitten Space Agency. Mod details and pictures come from the
  <a href="https://ksamodding.github.io/Borea/" rel="noopener">Borea</a> mod index.
  This list as data: <a href="/v1/all">v1/all</a> ·
  <a href="https://github.com/LaurensDeV/KSAMultiplayer" rel="noopener">Source</a>
</div></footer>
<noscript><div class="wrap"><p class="note">This page builds the list with a script. The same list as data is at <a href="/v1/all">v1/all</a>.</p></div></noscript>

<script>
"use strict";
// Everything a server or a directory says is a stranger's text. It reaches the page through
// textContent and through attributes checked first, and never as markup.

const LIST = "/v1/all";
// A server's page is an address of its own, so that a link to it can say whose it is.
const UNDER = "/s/";
const INDEX = "https://ksamodding.github.io/content-index-releases/v1/index.json";
const MOD_PAGE = "https://ksamodding.github.io/Borea/mod/";
const DEFAULT_PORT = 50100;
const OURS = "ksamultiplayer", CORE = "core";
const REFRESH_MS = 30000;
// What KSA's own list of systems calls them, for the ones it ships with.
const SYSTEMS = { SolLite: "Earth and Moon" };

const view = document.getElementById("view");
const state = { all: null, failed: false, index: null, indexFailed: false, at: 0, filter: "" };

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) e.append(kid);
  return e;
}
const web = u => typeof u === "string" && /^https:\/\//i.test(u) ? u : null;

// ---- what a listing says ----

const where = s => s.port === DEFAULT_PORT || s.srv ? s.host : `${s.host}:${s.port}`;
const key = s => `${s.host}:${s.port}`.toLowerCase();
const said = s => s.name || where(s);

function mods(s) {
  return String(s.mods || "").split(",").map(e => e.trim()).filter(Boolean).map(e => {
    const at = e.indexOf("@");
    const id = (at < 0 ? e : e.slice(0, at)).trim(), version = at < 0 ? "" : e.slice(at + 1).trim();
    return { id, version };
  }).filter(m => m.id);
}
const extras = s => mods(s).filter(m => ![CORE, OURS].includes(m.id.toLowerCase()));

// ---- the mod index ----

function listing(id) {
  return state.index?.get(id.toLowerCase()) || null;
}
function newest(l) {
  const by = (a, b) => String(b.release_date || "").localeCompare(String(a.release_date || ""));
  const all = [...(l?.releases || [])].sort(by);
  return all.find(r => r.release_status === "stable") || all[0] || null;
}
const VERSION = /^(\d+\.\d+\.\d+)(?:\.0)?(-[0-9A-Za-z.-]+)?$/;
function release(version) {
  let v = String(version || "").trim();
  const plus = v.indexOf("+");
  if (plus >= 0) v = v.slice(0, plus);
  const m = VERSION.exec(v);
  return m ? m[1] + (m[2] || "") : null;
}
function has(l, wanted) {
  return (l?.releases || []).find(r => release(r.version) === wanted) || null;
}
function newer(a, b) {
  const x = String(a).split(/[.-]/).map(Number), y = String(b).split(/[.-]/).map(Number);
  for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0);
  return false;
}
function bytes(n) {
  return n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : n >= 1024 ? `${Math.round(n / 1024)} KB` : `${n} bytes`;
}

// ---- the link Borea opens: the same one the game makes, from the same parts ----

const ID = /^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,62}[A-Za-z0-9])?$/;
function linkName(name) {
  let plain = [...String(name)].filter(c => c >= " " && c <= "~").join("").trim();
  if (plain.length > 64) plain = plain.slice(0, 64).trimEnd();
  return [...plain].map(c => c === " " ? "+" : /[A-Za-z0-9._~-]/.test(c) ? c
    : "%" + c.charCodeAt(0).toString(16).toUpperCase().padStart(2, "0")).join("");
}
function linkId(s) {
  if (s.id && s.id.length <= 58 && ID.test(s.id)) return "ksamp-" + s.id;
  let id = "ksamp-";
  for (const c of where(s).trim().toLowerCase()) {
    if (/[a-z0-9._]/.test(c)) id += c;
    else if (!id.endsWith("-")) id += "-";
  }
  id = id.slice(0, 64).replace(/[^a-z0-9]+$/, "");
  return id.length > 6 ? id : "";
}
// The link, or the reason there is none. Borea refuses the whole of a link it does not like,
// so one that cannot say what the server wants is not offered.
function modsLink(s) {
  if (!state.index) return { why: state.indexFailed ? "the mod index could not be read" : "reading the mod index" };
  const parts = [], seen = new Set();
  for (const m of mods(s)) {
    const lower = m.id.toLowerCase();
    if (lower === CORE || seen.has(lower)) continue;
    seen.add(lower);
    const l = listing(m.id);
    if (!ID.test(m.id) || !l) return { why: `${m.id} is not in the mod index` };
    const wanted = m.version ? release(m.version) : release(newest(l)?.version);
    if (!wanted) return { why: `${m.id} has no release a link can name` };
    if (!has(l, wanted)) return { why: `${m.id} ${wanted} is not in the mod index` };
    parts.push(`${l.id}@${wanted}`);
  }
  if (parts.length === 0) return { why: "" };
  if (parts.length > 100) return { why: "the list of mods is too long for a link" };
  let link = "borea://modlist?mods=" + parts.join(",");
  const name = linkName(s.name || ""), id = linkId(s);
  if (name) link += "&name=" + name;
  if (id) link += "&id=" + id;
  return link.length <= 2048 ? { link } : { why: "the list of mods is too long for a link" };
}

// ---- pieces ----

function icon(id) {
  const l = listing(id), url = web(l?.authored?.images?.icon?.url);
  const letters = (l?.authored?.name || id).replace(/[^A-Za-z0-9 ]/g, "").split(/\s+|(?<=[a-z])(?=[A-Z])/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
  const box = h("span", { class: "icon", title: l?.authored?.name || id, "aria-hidden": "true" }, letters || "?");
  if (url) {
    const img = h("img", { src: url, alt: "", loading: "lazy", referrerpolicy: "no-referrer" });
    img.addEventListener("load", () => box.replaceChildren(img));
  }
  return box;
}
function pills(s) {
  return [
    s.password && h("span", { class: "pill warn" }, "Password"),
    s.max > 0 && s.players >= s.max && h("span", { class: "pill bad" }, "Full"),
  ];
}
// How many are on it, over how full that makes it.
function seats(s) {
  const n = Math.max(0, s.players || 0), max = s.max > 0 ? s.max : 0;
  const full = max > 0 && n >= max;
  return h("div", { class: `seats ${n > 0 ? "some" : ""} ${full ? "full" : ""}` },
    h("div", { class: "n" }, h("b", {}, String(n)), max > 0 && h("span", {}, `/ ${max}`)),
    max > 0 && h("div", { class: "meter", role: "presentation" }, h("i", { style: `width:${Math.min(100, Math.round(100 * n / max))}%` })));
}
const world = s => s.system ? SYSTEMS[s.system] || s.system : "Not chosen yet";
// ---- the list ----

function listView() {
  document.title = "KSA Multiplayer servers";
  const head = [
    h("h1", {}, "Find a world to fly in"),
    h("p", { class: "lede" }, "Every public KSA Multiplayer server. Pick one to see which mods it needs and how to join."),
  ];
  if (!state.all) {
    return [...head, h("p", { class: `note ${state.failed ? "bad" : ""}`, style: "margin-top:30px" },
      state.failed ? "The list could not be read just now. It is asked again every half minute." : "Reading the list…")];
  }
  const rows = state.all.servers.map(c => c.listed);
  const online = rows.reduce((n, s) => n + Math.max(0, s.players || 0), 0);
  const list = h("ul", { class: "rows" }, items());
  const search = h("input", { type: "search", placeholder: "Search servers and mods", value: state.filter, "aria-label": "Search servers and mods",
    oninput: e => { state.filter = e.target.value; list.replaceChildren(...items()); } });
  return [
    ...head,
    h("div", { class: "bar" },
      h("span", { class: "tally" }, h("b", {}, String(rows.length)), rows.length === 1 ? "server" : "servers"),
      h("span", { class: `tally ${online > 0 ? "live" : ""}` }, h("b", {}, String(online)), online === 1 ? "player online" : "players online"),
      h("label", { class: "search" }, search)),
    list,
  ];
}

// The rows the search box leaves, from the list as it stands now.
function items() {
  const rows = state.all.servers.map(c => c.listed), q = state.filter.trim().toLowerCase();
  const now = !q ? rows : rows.filter(s =>
    [s.name, s.host, s.system, world(s), s.mods, ...mods(s).map(m => listing(m.id)?.authored?.name || "")]
      .some(t => String(t || "").toLowerCase().includes(q)));
  if (now.length === 0) return [h("li", { class: "note" }, rows.length === 0 ? "No server is listed right now." : "No server matches that.")];
  return now.map(row);
}

function row(s) {
  const more = extras(s);
  const names = more.map(m => listing(m.id)?.authored?.name || m.id);
  return h("li", {}, h("a", { class: "row", href: UNDER + encodeURIComponent(where(s)) },
    h("div", {}, h("div", { class: "name" }, said(s)), h("div", { class: "where" }, where(s))),
    h("div", { class: "world" }, world(s)),
    h("div", { class: "mods" },
      more.length > 0 && h("span", { class: "icons" }, more.slice(0, 4).map(m => icon(m.id))),
      h("span", {}, more.length === 0 ? "No extra mods" : names.join(", ")),
      pills(s)),
    seats(s),
    h("span", { class: "go", "aria-hidden": "true" }, "›")));
}

// ---- one server ----

function fact(label, value, small) {
  return h("div", { class: "fact" }, h("dt", {}, label), h("dd", {}, value, small && h("small", {}, small)));
}

function card(m) {
  const l = listing(m.id), a = l?.authored;
  const wanted = m.version ? release(m.version) || m.version : "";
  const rel = l ? (wanted ? has(l, wanted) : newest(l)) : null;
  const links = [
    l && h("a", { href: MOD_PAGE + encodeURIComponent(l.id) + "/", rel: "noopener" }, "Mod page"),
    web(rel?.download?.url) && h("a", { href: web(rel.download.url), rel: "noopener" },
      `Download ${release(rel.version) || ""}`.trim() + (rel.download.size ? ` (${bytes(rel.download.size)})` : "")),
    web(a?.links?.repository) && h("a", { href: web(a.links.repository), rel: "noopener" }, "Source"),
  ].filter(Boolean);
  return h("li", { class: "card panel" },
    icon(m.id),
    h("div", {},
      h("h3", {}, a?.name || m.id,
        wanted ? h("span", { class: "chip", title: "The release this server wants" }, wanted) : h("span", { class: "chip any" }, "any version"),
        l && wanted && !has(l, wanted) && h("span", { class: "pill warn" }, "not in the mod index")),
      a?.authors?.length > 0 && h("p", { class: "by" }, "by " + a.authors.join(", ")),
      a?.abstract && h("p", { class: "about" }, a.abstract),
      !l && h("p", { class: "about" }, state.index ? "This mod is not in the Borea mod index. Ask whoever runs the server where to get it."
        : state.indexFailed ? "The mod index could not be read, so there is nothing more to show about it." : "Reading the mod index…"),
      links.length > 0 && h("div", { class: "links" }, links)));
}

function serverView(id) {
  const c = state.all?.servers.find(c => where(c.listed).toLowerCase() === id || key(c.listed) === id);
  const back = h("a", { class: "back", href: "/" }, "← All servers");
  if (!state.all) return [back, h("p", { class: `note ${state.failed ? "bad" : ""}` }, state.failed ? "The list could not be read just now." : "Reading the list…")];
  if (!c) {
    document.title = "Not listed — KSA Multiplayer servers";
    return [back, h("h1", {}, "That server is not listed"),
      h("p", { class: "lede" }, "It may have stopped, or stopped listing itself. A server leaves the list a few minutes after it goes quiet.")];
  }
  const s = c.listed, all = mods(s), needed = all.filter(m => m.id.toLowerCase() !== CORE);
  document.title = `${said(s)} — KSA Multiplayer servers`;

  const copy = h("button", { class: "btn small", type: "button", onclick: async () => {
    try { await navigator.clipboard.writeText(where(s)); copy.textContent = "Copied"; } catch { copy.textContent = "Select and copy"; }
    setTimeout(() => copy.textContent = "Copy", 1600);
  } }, "Copy");

  const loaders = needed.map(m => listing(m.id)?.authored?.loader).filter(x => x?.id && x.min);
  const loader = loaders.reduce((best, x) => !best || newer(x.min, best.min) ? x : best, null);
  const got = modsLink(s);
  const down = () => {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 20 20"); svg.setAttribute("aria-hidden", "true");
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", "M10 3v9m0 0 3.5-3.5M10 12 6.5 8.5M4 16h12");
    path.setAttribute("fill", "none"); path.setAttribute("stroke", "currentColor"); path.setAttribute("stroke-width", "2");
    path.setAttribute("stroke-linecap", "round"); path.setAttribute("stroke-linejoin", "round");
    svg.append(path);
    return svg;
  };

  return [
    back,
    h("div", { class: "panel hero" },
      h("div", { class: "title" },
        h("div", {},
          h("div", { class: "status" },
            h("span", { class: "pill good" }, h("span", { class: "dot" }), "Online"),
            pills(s)),
          h("h1", {}, said(s))),
        h("div", { class: "address" }, h("code", {}, where(s)), copy)),
      h("dl", { class: "facts" },
        fact("Players", seats(s)),
        fact("World", world(s)),
        fact("KSA version", s.ksa || "Any", s.ksa ? "Your game has to match" : null),
        fact("Password", s.password ? "Needed" : "None", s.password ? "Ask whoever runs it" : null))),

    h("section", {},
      h("h2", {}, "How to join"),
      h("ol", { class: "steps panel" },
        h("li", {}, h("div", {},
          h("h3", {}, needed.length === 0 ? "No mods to get" : needed.length === 1 ? "Get the mod" : `Get the ${needed.length} mods`),
          needed.length === 0
            ? h("p", {}, String(s.mods || "").trim() ? "This server needs nothing beyond the game itself." : "This server has not said which mods it wants.")
            : h("p", {}, "Your game needs the same mods as the server, at the releases it wants. A server turns away a game that is missing one, and may turn away a game with mods it does not have."),
          got.link && h("div", { class: "cta" },
            h("a", { class: "btn primary big", href: got.link }, down(), "Get these mods with Borea"),
            h("small", {}, "Borea 0.6.20 or later sets up a separate copy of the game with exactly these mods. The game you play now is left as it is.")),
          !got.link && got.why && needed.length > 0 && h("p", { style: "margin-top:10px" }, `There is no one-click install for this server (${got.why}), so get each mod from the list below.`))),
        h("li", {}, h("div", {},
          h("h3", {}, "Start KSA"),
          h("p", {}, "The mod shows its server list when the game starts.", loader && ` It needs the ${loader.id} mod loader, ${loader.min} or later.`))),
        h("li", {}, h("div", {},
          h("h3", {}, "Connect"),
          h("p", {}, "Pick ", h("b", {}, said(s)), " from the list, or type ", h("kbd", {}, where(s)), " into the Server box, and press ", h("kbd", {}, "CONNECT"),
            s.password ? ". You will be asked for the password." : "."))))),

    needed.length > 0 && h("section", {},
      h("h2", {}, needed.length === 1 ? "The mod this server needs" : `The ${needed.length} mods this server needs`),
      h("p", { class: "sub" }, got.link ? "What the button above installs. You can also get each one yourself." : "Install each of these before you join."),
      h("ul", { class: "cards" }, needed.map(card))),
  ];
}

// ---- reading, and drawing again ----

function draw() {
  const route = location.pathname.startsWith(UNDER) ? decodeURIComponent(location.pathname.slice(UNDER.length)).toLowerCase() : "";
  // A list being typed into is left alone by a refresh: its rows are redrawn and its box is not.
  const typing = !route && document.activeElement?.type === "search";
  if (typing) {
    const list = view.querySelector(".rows");
    if (list && state.all) { list.replaceChildren(...items()); return; }
  }
  view.replaceChildren(...(route ? serverView(route) : listView()).filter(Boolean));
}

async function readList() {
  try {
    const r = await fetch(LIST, { headers: { Accept: "application/json" } });
    if (!r.ok) throw new Error(String(r.status));
    const all = await r.json();
    if (all?.v !== 1 || !Array.isArray(all.servers)) throw new Error("shape");
    all.servers = all.servers.filter(c => c?.listed?.host && Number.isInteger(c.listed.port));
    for (const c of all.servers) c.by = Array.isArray(c.by) ? c.by.map(String) : [];
    all.directories = Array.isArray(all.directories) ? all.directories.map(String) : [];
    [state.all, state.failed, state.at] = [all, false, Date.now()];
  } catch {
    state.failed = true;
  }
  draw();
}

async function readIndex() {
  try {
    const r = await fetch(INDEX);
    if (!r.ok) throw new Error(String(r.status));
    const index = await r.json();
    state.index = new Map((index.listings || []).filter(l => typeof l?.id === "string").map(l => [l.id.toLowerCase(), l]));
  } catch {
    state.indexFailed = true;
  }
  draw();
}

// A link within the page changes the address and draws again, without the page being fetched
// a second time for the sake of the tags in its head.
document.addEventListener("click", e => {
  const a = e.target.closest?.("a[href]");
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const to = a.getAttribute("href");
  if (to !== "/" && !to.startsWith(UNDER)) return;
  e.preventDefault();
  if (to !== location.pathname) history.pushState(null, "", to);
  draw();
  scrollTo(0, 0);
});
addEventListener("popstate", draw);
draw();
readList();
readIndex();
setInterval(() => { if (!document.hidden) readList(); }, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - state.at > REFRESH_MS) readList(); });
</script>
</body>
</html>
